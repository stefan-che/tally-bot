# tally-bot: Postgres + one-shot migrations + bot (Telegram + HTTP API + web admin).
# Optional: wallet-sync loop (profile "wallet-sync"), or run ./wallet_sync.sh from host cron instead.
#
#   cp .env.sample .env        # fill BOT_TOKEN, OWNER_ID, POSTGRES_PASSWORD, API_TOKEN, ADMIN_PASSWORD
#   docker compose up -d --build
#   docker compose --profile wallet-sync up -d    # + automatic balances every 5 minutes
#
# To reach a cleanroom-watcher running in another compose project on the same host, join its
# network (e.g. `processing-net`): uncomment the `listener` network at the bottom and in
# `bot` / `wallet-sync`, then keep LISTENER_API_URL=http://cleanroom-watcher:8080.

x-bot-env: &bot-env
  BOT_TOKEN: "${BOT_TOKEN}"
  OWNER_ID: "${OWNER_ID}"
  USE_GUARD: "${USE_GUARD:-true}"
  DEBUG_PRINT_INPUT: "${DEBUG_PRINT_INPUT:-}"
  POSTGRES_HOST: pg
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "${POSTGRES_USER:-ledger}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  POSTGRES_DB: "${POSTGRES_DB:-ledger}"
  API_PORT: "${API_PORT:-8080}"
  API_TOKEN: "${API_TOKEN}"
  ALLOWED_IPS: "${ALLOWED_IPS:-}"
  ADMIN_PATH: "${ADMIN_PATH:-/admin}"
  ADMIN_LOGIN: "${ADMIN_LOGIN:-admin}"
  ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
  WEBHOOK_HOST: "${WEBHOOK_HOST:-}"
  WEBHOOK_PATH: "${WEBHOOK_PATH:-/webhook/telegram}"
  WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
  LISTENER_API_URL: "${LISTENER_API_URL:-http://cleanroom-watcher:8080}"
  LISTENER_API_KEY: "${LISTENER_API_KEY:-}"
  LISTENER_NETWORK: "${LISTENER_NETWORK:-tron}"
  GOOGLE_CREDENTIAL_PATH: "${GOOGLE_CREDENTIAL_PATH:-}"
  GOOGLE_SHARE_EMAIL: "${GOOGLE_SHARE_EMAIL:-}"
  ROOT_FOLDER_NAME: "${ROOT_FOLDER_NAME:-Tally}"

services:
  pg:
    image: postgres:15
    container_name: ledger-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ledger}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB:-ledger}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build: .
    image: tally-bot:local
    environment: *bot-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      pg:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    image: tally-bot:local
    container_name: tally-bot
    restart: unless-stopped
    environment: *bot-env
    # Optional Google export: mount the service-account JSON and set
    # GOOGLE_CREDENTIAL_PATH=/secrets/google.json in .env
    # volumes:
    #   - ./secrets/google.json:/secrets/google.json:ro
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    # networks: [default, listener]

  wallet-sync:
    image: tally-bot:local
    profiles: ["wallet-sync"]
    restart: unless-stopped
    environment: *bot-env
    command: ["sh", "-c", "while true; do python3 wallet_sync.py; sleep ${WALLET_SYNC_INTERVAL:-300}; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    # networks: [default, listener]

volumes:
  pgdata:

